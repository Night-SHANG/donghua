name: Set up pinned native huashu
# Standard GitHub-hosted Ubuntu only. No user secrets or service credentials.
description: Install renderer prerequisites and fetch a verified exact public upstream commit.
inputs:
  build-audio:
    description: Build and verify audio (false only for silent chunk workers)
    default: 'true'
runs:
  using: composite
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Install encoder and pinned Python dependencies
      shell: bash
      run: |
        set -euo pipefail
        sudo apt-get update -qq
        sudo apt-get install -y --no-install-recommends ffmpeg
        python -m pip install --only-binary=:all: -r requirements-huashu-ci.txt
        python -m playwright install --with-deps chromium
        command -v ffmpeg
        command -v ffprobe
    - name: Fetch unchanged native huashu at the reviewed commit
      shell: bash
      env:
        BUILD_AUDIO: ${{ inputs.build-audio }}
        HUASHU_SHA: 8a0d7d72ca65fcce6f8ba82c4a6c8dfe35b8422c
      run: |
        set -euo pipefail
        mkdir -p .native/upstream
        git -C .native/upstream init
        git -C .native/upstream remote add origin https://github.com/alchaincyf/huashu-art-motion.git
        git -C .native/upstream fetch --depth=1 origin "$HUASHU_SHA"
        git -C .native/upstream checkout --detach FETCH_HEAD
        test "$(git -C .native/upstream rev-parse HEAD)" = "$HUASHU_SHA"
        if [ "$BUILD_AUDIO" = "false" ]; then
          python huashu/tools/ci.py prepare --skip-audio
        else
          python huashu/tools/ci.py prepare
        fi

        HUASHU_ENGINE="$PWD/.native/work/scripts/engine" node huashu/fox-stork/tests/test-native-state.js
