name: Paint original teapot short
on:
  push:
    branches: ['render/teapot-bubbles']
    paths: ['film/teapot/render-request.json']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: teapot-${{ github.ref }}
  cancel-in-progress: false
jobs:
  plan:
    runs-on: ubuntu-22.04
    outputs:
      stage: ${{ steps.plan.outputs.stage }}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - id: plan
        run: |
          node -e 'const r=require("./film/teapot/render-request.json");if(!["preview","full"].includes(r.stage))process.exit(1);console.log("stage="+r.stage)' >> "$GITHUB_OUTPUT"
  preview:
    needs: plan
    if: needs.plan.outputs.stage == 'preview'
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: node scripts/teapot/render.mjs
        env: {RENDER_STAGE: preview}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: teapot-preview
          path: out/teapot/
          retention-days: 3
  frames:
    needs: plan
    if: needs.plan.outputs.stage == 'full'
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        part: [0,1,2,3,4,5]
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg
          command -v ffmpeg
          npm ci --ignore-scripts --no-audit --no-fund
      - name: Paint56 actual frames with default browser sandbox
        env:
          PART: ${{ matrix.part }}
          RENDER_STAGE: full
        run: |
          export FRAME_START=$((PART * 56)) FRAME_END=$(((PART+1)*56))
          node scripts/teapot/render.mjs
          mkdir -p deliver
          ffmpeg -v error -y -framerate 24 -start_number "$FRAME_START" -i out/teapot/frames/f%05d.png -frames:v 56 -vf 'scale=out_color_matrix=bt709:out_range=tv,format=yuv420p,setparams=range=tv:colorspace=bt709:color_primaries=bt709:color_trc=bt709' -c:v libx264 -crf 17 -preset slow "deliver/part-${PART}.mp4"
          cp out/teapot/manifest.json "deliver/manifest-${PART}.json"
          for frame in "$FRAME_START" "$((FRAME_START+28))" "$((FRAME_END-1))"; do cp "out/teapot/frames/$(printf 'f%05d.png' "$frame")" deliver/; done
          if [ "$PART" -lt 5 ]; then cp "out/teapot/frames/$(printf 'f%05d.png' "$FRAME_END")" "deliver/boundary-${PART}.png"; fi
      - uses: actions/upload-artifact@v4
        with:
          name: teapot-part-${{ matrix.part }}
          path: deliver/
          retention-days: 3
  assemble:
    needs: frames
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg
          pip install --only-binary=:all: numpy==2.3.5
      - uses: actions/download-artifact@v4
        with:
          pattern: teapot-part-*
          path: parts
          merge-multiple: true
      - name: Mix and verify complete14second film
        run: |
          for i in 0 1 2 3 4; do cmp "parts/boundary-$i.png" "parts/$(printf 'f%05d.png' "$(((i+1)*56))")"; done
          mkdir -p final
          python scripts/teapot/build_audio.py
          ffmpeg -v error -y -i film/teapot/audio/mix.wav -c:a aac -b:a 192k final/music.m4a
          for i in 0 1 2 3 4 5; do echo "file '$PWD/parts/part-$i.mp4'"; done > /tmp/concat.txt
          ffmpeg -v error -y -f concat -safe 0 -i /tmp/concat.txt -i final/music.m4a -map 0:v:0 -map 1:a:0 -c copy -t 14 -movflags +faststart final/teapot-bubbles-1080p.mp4
          python scripts/teapot/verify.py final/teapot-bubbles-1080p.mp4
          ffmpeg -v error -y -i final/teapot-bubbles-1080p.mp4 -vf 'fps=1,scale=480:-1,tile=3x5' -frames:v 1 final/contact.png
          cp film/teapot/audio/audio-build.json final/
          sha256sum final/teapot-bubbles-1080p.mp4 > final/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: teapot-final
          path: final/
          retention-days: 7
