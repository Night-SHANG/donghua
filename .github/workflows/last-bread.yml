name: Last bread character views and pilot
on:
  push:
    branches: ['render/last-bread-pilot']
    paths: ['film/last-bread/render-request.json']
  workflow_dispatch:
    inputs:
      stage:
        description: Explicit review stage (never progresses automatically)
        type: choice
        options: [views, pilot]
        default: views
        required: true
permissions:
  contents: read
concurrency:
  group: last-bread-${{ github.ref }}
  cancel-in-progress: false
jobs:
  render:
    runs-on: ubuntu-22.04
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate explicit requested stage
        id: stage
        env:
          EVENT: ${{ github.event_name }}
          INPUT_STAGE: ${{ inputs.stage }}
        run: |
          if [ "$EVENT" = workflow_dispatch ]; then
            node --input-type=module -e 'import {requestStage} from "./scripts/render-last-bread.mjs"; console.log("stage="+requestStage({stage:process.env.INPUT_STAGE}));' >> "$GITHUB_OUTPUT"
          else
            stage="$(node scripts/render-last-bread.mjs --request-stage film/last-bread/render-request.json)"
            echo "stage=$stage" >> "$GITHUB_OUTPUT"
          fi
      - name: Install standard encoder explicitly
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg
          command -v ffmpeg
          command -v ffprobe
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - uses: actions/setup-python@v5
        if: steps.stage.outputs.stage == 'pilot'
        with:
          python-version: '3.12'
      - name: Locked pilot audio dependencies
        if: steps.stage.outputs.stage == 'pilot'
        run: |
          pip install --only-binary=:all: -r requirements-audio.txt
      - name: PNG-only runner and character contracts
        if: steps.stage.outputs.stage == 'views'
        run: BREAD_PNG_ONLY=1 node --test tests/last-bread/characters.test.mjs tests/last-bread/runner.test.mjs
      - name: Full pilot contracts and original soundtrack
        if: steps.stage.outputs.stage == 'pilot'
        run: |
          node --test
          bash scripts/build-last-bread-audio.sh
      - name: Focused watercolor art regression (front, side, back)
        if: steps.stage.outputs.stage == 'views'
        run: |
          mkdir -p out/last-bread/frames
          for frame in 0 48 96; do
            node scripts/render-last-bread.mjs --loop breadViews --start "$frame" --end "$((frame + 1))" --out "out/last-bread/view-$frame"
            cp out/last-bread/view-$frame/frames/*.png out/last-bread/frames/
          done
          ffmpeg -hide_banner -loglevel error -y -pattern_type glob -i 'out/last-bread/frames/f*.png' -vf 'scale=640:360,tile=3x1' -frames:v 1 out/last-bread/character-contact-sheet.jpg
      - name: Render120 continuous pilot frames, then encode and measure
        if: steps.stage.outputs.stage == 'pilot'
        run: |
          node scripts/render-last-bread.mjs --loop breadPilot --start 0 --end 120 --out out/last-bread
          node scripts/encode-last-bread.mjs out/last-bread film/last-bread/audio/mix-aac.m4a
          cp film/last-bread/audio/technical-qa.json out/last-bread/audio-technical-qa.json
          cp film/last-bread/events.json film/last-bread/score.json out/last-bread/
          sha256sum out/last-bread/*.mp4 > out/last-bread/SHA256SUMS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: last-bread-${{ steps.stage.outputs.stage }}-${{ github.sha }}
          path: out/last-bread/
          retention-days: 7
