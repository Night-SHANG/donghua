name: Last bread character views and pilot
on:
  push:
    branches: ['render/last-bread-pilot']
    paths: ['film/last-bread/render-request.json']
  workflow_dispatch:
    inputs:
      stage:
        description: Explicit review stage (never progresses automatically)
        type: choice
        options: [views, pilot]
        default: views
        required: true
permissions:
  contents: read
concurrency:
  group: last-bread-${{ github.ref }}
  cancel-in-progress: false
jobs:
  render:
    runs-on: ubuntu-22.04
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate explicit requested stage
        id: stage
        env:
          EVENT: ${{ github.event_name }}
          INPUT_STAGE: ${{ inputs.stage }}
        run: |
          if [ "$EVENT" = workflow_dispatch ]; then
            node --input-type=module -e 'import {requestStage} from "./scripts/render-last-bread.mjs"; console.log("stage="+requestStage({stage:process.env.INPUT_STAGE}));' >> "$GITHUB_OUTPUT"
          else
            stage="$(node scripts/render-last-bread.mjs --request-stage film/last-bread/render-request.json)"
            echo "stage=$stage" >> "$GITHUB_OUTPUT"
          fi
      - name: Install standard encoder explicitly
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg
          command -v ffmpeg
          command -v ffprobe
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Focused runner and character contracts
        run: BREAD_PNG_ONLY=1 node --test tests/last-bread/characters.test.mjs tests/last-bread/runner.test.mjs
      - name: Actual watercolor views (ten representative angles and expressions)
        if: steps.stage.outputs.stage == 'views'
        run: |
          node scripts/render-last-bread.mjs --loop breadViews --out out/last-bread
          ffmpeg -hide_banner -loglevel error -y -pattern_type glob -i 'out/last-bread/frames/f*.png' -vf 'scale=640:360,tile=2x5' -frames:v 1 out/last-bread/character-contact-sheet.jpg
      - name: Pilot is not yet available in this checkpoint
        if: steps.stage.outputs.stage == 'pilot'
        run: |
          echo 'Pilot implementation is pending; this reviewed checkpoint enables views only.' >&2
          exit 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: last-bread-${{ steps.stage.outputs.stage }}-${{ github.sha }}
          path: out/last-bread/
          retention-days: 7
