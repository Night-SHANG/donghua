name: Native Spatial Four Seasons Leaf (Three/WebGL) complete 15-second sample
run-name: Spatial Four Seasons Leaf (Three/WebGL) / ${{ github.sha }}
on:
  push:
    branches: ['feat/huashu-seasons-leaf-3d', 'render/huashu-seasons-leaf-3d', 'render/huashu-seasons-leaf-3d-*', 'feat/huashu-fox-stork']
    paths:
      - '.github/workflows/huashu-seasons-leaf-3d.yml'
      - 'huashu/tools/render_seasons_3d.py'
      - 'huashu/tools/webgl_runtime.py'
      - 'huashu/seasons-3d-tests/**'
      - 'huashu/seasons-leaf-3d/**'
      - 'requirements-huashu-seasons-3d.txt'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: native-seasons-leaf-3d-${{ github.ref }}
  cancel-in-progress: false
env:
  PYTHONUNBUFFERED: '1'
  PYTHONUTF8: '1'
  PYTHONDONTWRITEBYTECODE: '1'
jobs:
  complete-short:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install standard native renderer and audio tools
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg
          python -m pip install --only-binary=:all: -r requirements-huashu-seasons-3d.txt
          python -m playwright install --with-deps chromium
      - name: Verify render/evidence contracts
        run: python -m unittest discover -s huashu/seasons-3d-tests -v
      - name: Fetch clean exact native engine
        env:
          HUASHU_SHA: 8a0d7d72ca65fcce6f8ba82c4a6c8dfe35b8422c
        run: |
          set -euo pipefail
          mkdir -p .native-seasons-3d/upstream
          git -C .native-seasons-3d/upstream init
          git -C .native-seasons-3d/upstream remote add origin https://github.com/alchaincyf/huashu-art-motion.git
          git -C .native-seasons-3d/upstream fetch --depth=1 origin "$HUASHU_SHA"
          git -C .native-seasons-3d/upstream checkout --detach FETCH_HEAD
          test "$(git -C .native-seasons-3d/upstream rev-parse HEAD)" = "$HUASHU_SHA"
          test -z "$(git -C .native-seasons-3d/upstream status --porcelain --untracked-files=no)"
      - name: Verify actual WebGL, then one complete 15-second spatial render
        run: python huashu/tools/render_seasons_3d.py render --out seasons-3d-output
      - name: Guard every upload including diagnostic artifacts
        id: size
        if: always()
        continue-on-error: true
        run: python huashu/tools/render_seasons_3d.py check-size --out seasons-3d-output
      - uses: actions/upload-artifact@v4
        if: always() && steps.size.outcome == 'success'
        with:
          name: seasons-leaf-3d-15s-${{ github.sha }}-${{ github.run_attempt }}
          path: seasons-3d-output/
          retention-days: 1
          compression-level: 0
          if-no-files-found: error
