name: Stick Duel 12s
on:
  push:
    branches: [feat/huashu-fox-stork]
    paths: ['remotion/stick-duel/**', '.github/workflows/stick-duel.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Read render plan
        id: plan
        working-directory: remotion/stick-duel
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          p=json.load(open('render-plan.json'))
          assert p['mode'] in ('preview','final')
          print('mode='+p['mode'])
          print('approved='+p.get('approvedPreviewCommit',''))
          PY
      - name: Install pinned packages
        working-directory: remotion/stick-duel
        run: npm ci --no-audit --no-fund
      - name: Rebuild original audio
        working-directory: remotion/stick-duel
        run: |
          python -m pip install numpy==2.2.6 scipy==1.15.3
          python audio/synthesize.py
          mkdir -p public/audio
          cp audio/master.wav public/audio/master.wav
      - name: Preflight
        working-directory: remotion/stick-duel
        run: |
          npm run typecheck
          npm test
          python -m unittest discover -s audio -p 'test_audio.py'
      - name: Inspect preview authorization
        if: steps.plan.outputs.mode == 'final'
        env:
          APPROVED: ${{ steps.plan.outputs.approved }}
        run: |
          test -n "$APPROVED"
          git cat-file -e "$APPROVED^{commit}"
          git diff --exit-code "$APPROVED" HEAD -- remotion/stick-duel/src remotion/stick-duel/public remotion/stick-duel/audio
      - name: Render
        working-directory: remotion/stick-duel
        env:
          MODE: ${{ steps.plan.outputs.mode }}
        run: |
          if [ "$MODE" = preview ]; then node scripts/render.mjs --stills; else node scripts/render.mjs; fi
          echo "$(git rev-parse HEAD)" > out/source-commit.txt
          sha256sum out/* > out/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stick-duel-${{ steps.plan.outputs.mode }}
          path: remotion/stick-duel/out/
          retention-days: 1
